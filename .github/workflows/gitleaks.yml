name: Secret Scan — Gitleaks

# Runs automatically on every push and pull request targeting main,
# and on a weekly schedule. Scans the full commit history for
# accidentally committed secrets (API keys, tokens, credentials).
#
# Important for a public repository maintained alongside multiple
# other projects/environments, to catch any accidental leak early.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so gitleaks can scan past commits too

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
