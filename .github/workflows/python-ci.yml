name: Python CI — MLBT Pilot Demo

# Runs automatically on every push and pull request targeting main.
# Verifies that the public pilot demo (pilot_demo.py + interfaces.py)
# still runs correctly. No confidential engine code is involved here.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run pilot demo (smoke test)
        run: python pilot_demo.py

      - name: Run unit tests (if present)
        run: |
          if [ -f test_pilot_demo.py ]; then pytest -v; else echo "No test file yet — skipping."; fi
